name: DAT535 — STATS19 Production Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:
  

permissions:
  contents: read

concurrency:
  group: stats19-production
  cancel-in-progress: false

jobs:
  deploy-prod:
    name: Validate and run Bronze to Gold
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    timeout-minutes: 30
    environment: main
    env:
      SPARK_HOME: /opt/spark
      JAVA_HOME: /usr/lib/jvm/java-8-openjdk-amd64
      STATS19_BRONZE_DIR: ${{ vars.STATS19_BRONZE_DIR || '/home/ubuntu/group16/project/data/bronze/stats19' }}

    steps:
      - name: Checkout validated code
        uses: actions/checkout@v7

      - name: Resolve persistent output directory
        id: paths
        shell: bash
        run: printf 'root=%s\n' "$HOME/stats19-pipeline/prod" >> "$GITHUB_OUTPUT"

      - name: Run small pipeline tests
        shell: bash
        run: |
          set -euo pipefail
          bash project/scripts/run_tests.sh 2>&1 | tee "$RUNNER_TEMP/stats19-tests.log"

      - name: Run Bronze to Silver to Gold
        shell: bash
        env:
          STATS19_OUTPUT_ROOT: ${{ steps.paths.outputs.root }}
        run: |
          set -euo pipefail
          bash project/scripts/run_project.sh --env prod \
            --bronze "$STATS19_BRONZE_DIR" --output-root "$STATS19_OUTPUT_ROOT" \
            2>&1 | tee "$RUNNER_TEMP/stats19-pipeline.log"

      - name: Build analytical figures and summary
        shell: bash
        env:
          STATS19_OUTPUT_ROOT: ${{ steps.paths.outputs.root }}
        run: |
          source "$HOME/spark-env/bin/activate"
          python project/scripts/render_results.py --env prod \
            --gold "$STATS19_OUTPUT_ROOT/gold" --output "$STATS19_OUTPUT_ROOT/presentation"
          head -n 7 "$STATS19_OUTPUT_ROOT/presentation/results.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload run evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stats19-production-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/stats19-tests.log
            ${{ runner.temp }}/stats19-pipeline.log
            ${{ steps.paths.outputs.root }}/pipeline/runs/**/quality_report.json
            ${{ steps.paths.outputs.root }}/presentation/
          retention-days: 30
          if-no-files-found: warn
